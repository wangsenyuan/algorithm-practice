<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <rect width="720" height="640" fill="#ffffff"/>

  <text x="360" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">
    Codeforces 2238C - Sample 3
  </text>
  <text x="360" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">
    n = 7, parents p2..p7 = 1 2 1 3 5 5 (rooted at 1)
  </text>

  <!-- edges: 1-2, 1-4, 2-3, 3-5, 5-6, 5-7 -->
  <line x1="360" y1="130" x2="220" y2="230" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="360" y1="130" x2="520" y2="230" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="230" x2="220" y2="340" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="340" x2="220" y2="450" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="450" x2="130" y2="560" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="450" x2="310" y2="560" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- root 1 -->
  <circle cx="360" cy="130" r="32" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
  <text x="360" y="130" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">1</text>

  <!-- 2 -->
  <circle cx="220" cy="230" r="30" fill="#eef2ff" stroke="#475569" stroke-width="3"/>
  <text x="220" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">2</text>

  <!-- 4 leaf -->
  <circle cx="520" cy="230" r="30" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="520" y="230" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">4</text>

  <!-- 3 -->
  <circle cx="220" cy="340" r="30" fill="#eef2ff" stroke="#475569" stroke-width="3"/>
  <text x="220" y="340" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">3</text>

  <!-- 5 -->
  <circle cx="220" cy="450" r="30" fill="#eef2ff" stroke="#475569" stroke-width="3"/>
  <text x="220" y="450" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">5</text>

  <!-- 6 leaf -->
  <circle cx="130" cy="560" r="30" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="130" y="560" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">6</text>

  <!-- 7 leaf -->
  <circle cx="310" cy="560" r="30" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <text x="310" y="560" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">7</text>

  <!-- legend -->
  <circle cx="420" cy="600" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="455" y="605" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#374151">root</text>
  <circle cx="520" cy="600" r="12" fill="#eef2ff" stroke="#475569" stroke-width="2"/>
  <text x="555" y="605" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#374151">internal</text>
  <circle cx="640" cy="600" r="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="675" y="605" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="#374151">leaf</text>
</svg>
