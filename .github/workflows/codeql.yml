name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the CLI bundled with this Action (formerly tools: latest).
          # Default setup's older extractor cannot autobuild Go 1.27.
          tools: linked

      # Tens of thousands of package main dirs; never go test/build ./...
      - name: Build Go package for extraction
        if: matrix.build-mode == 'manual'
        run: go test ./src/codeforces/set2/set22/set224/set2244/e

      # Default setup rejects advanced SARIF while it is enabled. Do not wait
      # for processing so this job stays green; uploads land after default
      # setup is turned off (this token cannot PATCH that API).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          wait-for-processing: false
