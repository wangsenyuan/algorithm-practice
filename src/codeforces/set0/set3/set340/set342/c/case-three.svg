<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">Case 3: leftover height reaches the triangular threshold</title>
  <desc id="desc">A cupboard top with three mutually touching balloons fitting when x is at least sqrt three times r over 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="420" height="300" fill="#fff"/>
  <path d="M70 140 A100 100 0 0 1 270 140" fill="none" stroke="#222" stroke-width="4"/>
  <path d="M70 140 L70 250 M270 140 L270 250 M70 250 L270 250" fill="none" stroke="#222" stroke-width="4"/>
  <rect x="70" y="140" width="200" height="87" fill="#f3c969" opacity="0.45"/>
  <circle cx="120" cy="176.6" r="50" fill="#8fc7ff" stroke="#1f5f9f" stroke-width="3"/>
  <circle cx="220" cy="176.6" r="50" fill="#8fc7ff" stroke="#1f5f9f" stroke-width="3"/>
  <circle cx="170" cy="90" r="50" fill="#8fc7ff" stroke="#1f5f9f" stroke-width="3"/>
  <line x1="120" y1="176.6" x2="170" y2="90" stroke="#666" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="220" y1="176.6" x2="170" y2="90" stroke="#666" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="302" y1="140" x2="302" y2="226.6" stroke="#444" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="315" y="178" font-family="Arial, sans-serif" font-size="15" fill="#222">x >= sqrt(3)r/2</text>
  <text x="74" y="276" font-family="Arial, sans-serif" font-size="17" fill="#222">The upper balloon can sit on the lower two: +3</text>
  <text x="104" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d365c">1</text>
  <text x="204" y="181" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d365c">2</text>
  <text x="154" y="95" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0d365c">3</text>
</svg>
